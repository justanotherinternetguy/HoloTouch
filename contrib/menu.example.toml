# Copy to ~/.config/holotouch/menu.toml to replace the built-in pie menu.
# Item types: command, app, submenu, window_action, workspace, send_to_workspace, running_windows, track, key,
# app_actions, phone.
# Keep each level to 12 items or fewer.

[[item]]
name = "Terminal"
icon = "utilities-terminal"
type = "command"
data = "exo-open --launch TerminalEmulator"  # XFCE's way; elsewhere name the terminal itself, as "kgx"

[[item]]
name = "Browser"
icon = "web-browser"
type = "command"
data = "exo-open --launch WebBrowser"

[[item]]
name = "Editor"
icon = "accessories-text-editor"
type = "app"
data = "org.xfce.mousepad.desktop"

[[item]]
name = "Windows"
icon = "view-grid"
type = "running_windows"

# The keys of the app in use, which HoloTouch names for it: "This page" in a web browser, with
# back, forward, the tabs and Escape; "This terminal", "This folder", "This video" and "This document"
# in those; and "This app" in anything else, with copy, paste, undo and Escape.
[[item]]
name = "This app"
icon = "keys"
type = "app_actions"

# A key of your own is a "key" item, pressed in whatever has the keyboard: one character, or
# space, Return, Escape, Tab, BackSpace, Delete, Home, End, Page_Up, Page_Down, Left, Right, Up,
# Down or F1 to F12, with ctrl, shift or alt held if named first.
#   name = "New tab", type = "key", data = "ctrl+t"
# A "phone" item sends the page in the web browser to the phone, as tossing an open palm does.

[[item]]
name = "Window"
type = "submenu"

  [[item.children]]
  name = "Maximize"
  type = "window_action"
  data = "maximize"

  [[item.children]]
  name = "Tile right"
  type = "window_action"
  data = "tile_right"

  [[item.children]]
  name = "Close"
  type = "window_action"
  data = "close"

  [[item.children]]
  name = "Minimize"
  type = "window_action"
  data = "minimize"

  [[item.children]]
  name = "Tile left"
  type = "window_action"
  data = "tile_left"

  [[item.children]]
  name = "To workspace 2"
  type = "send_to_workspace"
  data = 1

[[item]]
name = "Music"
icon = "applications-multimedia"
type = "submenu"

  [[item.children]]
  name = "Next track"
  icon = "media-skip-forward"
  type = "track"
  data = "next"

  [[item.children]]
  name = "Play / pause"
  icon = "media-playback-start"
  type = "track"
  data = "play_pause"

  [[item.children]]
  name = "Previous track"
  icon = "media-skip-backward"
  type = "track"
  data = "previous"
