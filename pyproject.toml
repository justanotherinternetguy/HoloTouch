[project]
name = "holotouch"
version = "0.1.0"
description = "Spatial hand-gesture window control for XFCE on X11 and GNOME on Wayland"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mediapipe==1.0.1",
    "numpy",
    "PySide6",
    "xcffib",
    "evdev",
    "jeepney>=0.9.0",
]

[project.scripts]
holotouch = "holotouch.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/holotouch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
